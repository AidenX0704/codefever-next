version: 2

updates:
  # Go 后端
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]

  # 前端
  - package-ecosystem: npm
    directory: /www/view
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    # 注意: www/view/package.json 里 @pgyer/mui-theme-preset 声明为 latest,
    # 而 yarn.lock 已把它锁到 0.0.3。Dependabot 升级该依赖会引入 UI 漂移,
    # 因此这里关闭了它的自动升级 —— 升级前请先跑截图逐像素比对。
    ignore:
      - dependency-name: "@pgyer/mui-theme-preset"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
