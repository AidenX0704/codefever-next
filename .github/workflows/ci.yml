name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  backend:
    name: Go 后端 (build / vet / fmt / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: 编译
        working-directory: backend
        run: go build ./...

      - name: 静态检查
        working-directory: backend
        run: go vet ./...

      - name: 格式检查
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: 单元测试
        working-directory: backend
        run: go test ./internal/...

  contract:
    name: 契约基线完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: 契约 manifest 自校验
        working-directory: backend
        run: go test ./internal/contract/...

      - name: 契约基线文件齐全性
        working-directory: backend
        run: |
          missing=0
          for f in testdata/contract/*.json; do
            if [ ! -s "$f" ]; then
              echo "::error::契约基线为空: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "契约基线 $(ls testdata/contract/*.json | wc -l) 条齐全"

  image:
    name: 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 compose 文件
        run: docker compose config --quiet

      - name: 构建镜像
        run: |
          docker build \
            -f Dockerfile \
            --build-arg REGISTRY=docker.1ms.run \
            -t codefever-next:local .

      - name: 校验镜像内无 PHP
        run: |
          set -eux
          docker run --rm --entrypoint sh codefever-next:local -c '
            command -v php  && { echo "镜像内仍存在 php"; exit 1; } || true
            command -v php-fpm && { echo "镜像内仍存在 php-fpm"; exit 1; } || true
            for p in /usr/local/lib/php /usr/local/etc/php /usr/src/php.tar.xz; do
              [ -e "$p" ] && { echo "仍存在 $p"; exit 1; } || true
            done
            [ -e /opt/docker/etc/supervisor.d/php-fpm.conf ] && { echo "supervisor 仍会拉起 php-fpm"; exit 1; } || true
            [ -e /opt/docker/etc/supervisor.d/cron.conf ] && { echo "supervisor 仍会拉起 crond"; exit 1; } || true
          '

  frontend:
    name: 前端构建产物一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验前端产物已随仓库提交
        run: |
          set -eux
          for f in www/view/build/index.html www/view/build/asset-manifest.json; do
            [ -s "$f" ] || { echo "::error::缺少前端构建产物: $f"; exit 1; }
          done

      # 说明: 本仓库**故意不在 CI 里跑 yarn install**。
      # www/view/package.json 里 @pgyer/mui-theme-preset 声明为 latest,
      # 重新安装依赖会拉到新版本导致 UI 漂移, 且 yarn.lock 只锁住了它。
      # 前端产物的可复现性验证由 scripts/shotcmp.py 的逐像素比对承担(见 CONTRIBUTING.md)。
      - name: 说明
        run: echo "前端产物已随仓库提交, 依仓库约定不在 CI 中重装依赖。"
