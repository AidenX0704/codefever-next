[group:codefever-worker]
programs=codefever-worker
priority=30

[program:codefever-worker]
; 后台事件 worker：消费 cc_events 队列表并派发给
; 活动流 / 站内信+邮件 / webhook 三个 handler。
;
; PHP 侧这些动作是**同步内联**在 HTTP 请求里执行的（连发邮件都在请求线程内），
; 挪到独立进程后，慢的 SMTP 与 webhook 投递不再拖住 API 响应。
command = /data/www/codefever-community/bin/codefever-worker -base /data/www/codefever-community
process_name=%(program_name)s
startsecs = 0
autostart = true
autorestart = true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
