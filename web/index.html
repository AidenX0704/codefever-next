<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- 主题色（浏览器地址栏 / 移动端状态栏）。两个值必须与 theme.css 的 --bg-canvas 保持一致；
         这是平台 API，只能写字面值，属于 §5「有明确外部格式要求的常量」例外。 -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <!-- 首屏防闪白：在样式表与 React 之前落主题（AGENTS §5 / V3 §9）。
         逻辑与 src/helpers/theme.ts 的 initTheme() 保持一致 —— 改一处必须同步另一处。 -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('cf-theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <meta name="description" content="CodeFever Next" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <title>CodeFever Next</title>
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.<br />
      打开浏览器对 Javascript 的支持以访问此页面
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
