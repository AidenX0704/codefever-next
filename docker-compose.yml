# =============================================================================
#  CodeFever Next —— Docker Compose 编排
# =============================================================================
#  镜像**从本地源码构建**（Dockerfile），不依赖任何上游预构建镜像，
#  构建期也不需要访问 GitHub。
#
#  用法 / Usage:
#      docker compose up -d --build     # 构建并启动
#      docker compose ps                # 查看状态
#      docker compose logs -f codefever # 跟踪日志
#      docker compose down              # 停止（保留数据卷）
#
#  访问 / Access:  http://localhost:9080
#  默认账号 / Default login: root@codefever.cn / 123456
#
#  可用环境变量 / Environment overrides:
#      CODEFEVER_HTTP_PORT  宿主 HTTP 端口 (默认 9080)
#      CODEFEVER_SSH_PORT   宿主 SSH  端口 (默认 2222)
#      CODEFEVER_DB_PASS    数据库 root 口令 (默认 123456)
#      CODEFEVER_IMAGE      应用镜像名 (默认 codefever-next:local)
#      CODEFEVER_MYSQL_IMAGE 数据库镜像 (默认 mysql:8.0)
#      CODEFEVER_BASE_RUNTIME  运行时基础镜像
#      CODEFEVER_BASE_GO       Go 编译基础镜像
# =============================================================================

name: codefever-next

services:
  db:
    # Go 后端要求 MySQL 8.0+：事件 worker 与 webhook 投递器用
    # `FOR UPDATE SKIP LOCKED` 领取任务行，该语法自 MySQL 8.0.1 起才支持。
    # 在 5.7 上这两条查询会直接报 SQL 语法错误，导致活动流、站内信、
    # 邮件通知与 webhook **全部静默失效**。
    image: "${CODEFEVER_MYSQL_IMAGE:-mysql:8.0}"
    container_name: codefever-next-db
    restart: unless-stopped
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_general_ci'
      - '--max_connections=3000'
      # MySQL 8.0 默认认证插件是 caching_sha2_password，而应用容器里带的是
      # MariaDB 客户端（misc/create_db.sh 用它建库），该客户端没有
      # caching_sha2_password 插件 → 建库直接失败。改用 mysql_native_password。
      - '--default-authentication-plugin=mysql_native_password'
    environment:
      MYSQL_ROOT_PASSWORD: "${CODEFEVER_DB_PASS:-123456}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${CODEFEVER_DB_PASS:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  codefever:
    image: "${CODEFEVER_IMAGE:-codefever-next:local}"
    container_name: codefever-next-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # 从本地源码构建。镜像缺失时 `docker compose up -d` 会自动构建，
    # 也可显式 `docker compose up -d --build` 强制重建。
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_RUNTIME: "${CODEFEVER_BASE_RUNTIME:-docker.1ms.run/webdevops/php-nginx:7.4}"
        BASE_GO: "${CODEFEVER_BASE_GO:-docker.1ms.run/library/golang:1.25-bookworm}"
    ports:
      # 宿主机:容器 —— 80/22/8080 常被占用, 默认改用 9080 / 2222。
      # 需要换端口时设置环境变量即可:
      #   $env:CODEFEVER_HTTP_PORT = '18080'; $env:CODEFEVER_SSH_PORT = '18022'
      - "${CODEFEVER_HTTP_PORT:-9080}:80"
      - "${CODEFEVER_SSH_PORT:-2222}:22"
    environment:
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASS: "${CODEFEVER_DB_PASS:-123456}" # 需与 MYSQL_ROOT_PASSWORD 一致
      DB_NAME: "codefever_community"
      # 让服务以 git 用户运行 (webdevops 镜像的 CONTAINER_UID 机制):
      #   1) 与 env.yaml 的 users.www: git 保持一致 (上游完整版即如此)
      #   2) 应用进程需要能写 /home/git/.ssh/authorized_keys,
      #      否则 SSH 公钥同步不到该文件, SSH 方式 clone/pull 不可用
      # 注: PHP 时代的 modify_authorized_keys 守护进程已下线, 现在由 Go 后端
      # (以 root 运行) 直接写 authorized_keys, PHP-FPM 的运行用户与之无关。
      CONTAINER_UID: "git"
      # 口令哈希的写入格式:
      #   legacy (默认) —— md5(md5(x)), 与历史 PHP 后端逐字一致
      #   argon2id      —— OWASP 推荐的内存硬函数
      #
      # PHP 后端已下线, 库里的历史口令哈希仍是 legacy 格式, 因此默认保持 legacy,
      # **存量账号无需重置口令即可登录**。待全部账号重置过口令之后,
      # 再把它切成 argon2id。
      CODEFEVER_PASSWORD_HASH: "${CODEFEVER_PASSWORD_HASH:-legacy}"
    volumes:
      # 使用命名卷而非绑定挂载: 命名卷首次创建时会从镜像内容初始化,
      # 因此 git-storage/hooks/* 的符号链接得以保留。
      - git-storage:/data/www/codefever-community/git-storage
      - file-storage:/data/www/codefever-community/file-storage

volumes:
  db-data:
  git-storage:
  file-storage:
