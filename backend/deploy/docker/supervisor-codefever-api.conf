[group:codefever-api]
programs=codefever-api
priority=30

[program:codefever-api]
; Go 后端（替换 PHP-FPM 承载应用层的新实现）。
;
; PHP 后端已下线, 镜像内不存在 php / php-fpm —— nginx 的 upstream 固定指向
; 127.0.0.1:9001, 不再有 CODEFEVER_BACKEND 切流开关, 也不存在回滚路径。
;
; 本服务与两个 Go 网关读同一份 env.yaml（BASE 目录下），因此共享同一个
; gateway.token 与同一个数据库。
;
; 环境变量（如 CODEFEVER_PASSWORD_HASH）由 supervisord 从容器环境继承，
; 无需在此重复声明 —— supervisord 启动的子进程默认继承父进程环境。
; 只监听 loopback：nginx 与后端同容器，没有必要把 9001 暴露给其它网络。
; 这样 nginx 的请求体上限、超时与 X-Forwarded-* 就是唯一入口约束，
; 无法绕过 nginx 直连 /apiv1/internal/*。
command = /data/www/codefever-community/bin/codefever-api -base /data/www/codefever-community -addr 127.0.0.1:9001
process_name=%(program_name)s
startsecs = 0
autostart = true
autorestart = true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
