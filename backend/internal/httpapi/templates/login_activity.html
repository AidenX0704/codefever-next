{{- /*
数据契约：无（不需要外部数据）。

移植说明：
  PHP 侧 $appId 由包含它的页面模板（login/register/reset_password/verify）定义，
  值为常量 '_pgyer_codefever_'。Go 模板之间不共享变量作用域，
  因此这里在模板内重新声明同一个常量，取值与 PHP 完全一致。

转义决策：
  $appId 是模板内常量，不含 HTML 特殊字符，走 Go 默认转义即可。
*/ -}}
{{- $appId := "_pgyer_codefever_" -}}
<div style="width:100%;height:644px;" class="flexRowCenter bg-color{{ $appId }}">
    <img src="/static/images/activity{{ $appId }}.png" style="width: 100%;height:100%;" />
</div>
