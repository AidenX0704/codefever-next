# CodeFever Next —— 后端重写契约基线清单
#
# 权威来源（逐字阅读推导，不是猜测）：
#   application/controllers/api/{user,admin,group,repository}.php
#   application/controllers/apiv1/internal.php
#   application/controllers/api/base.php        (分派规则：<action>_<METHOD>)
#   application/libraries/service/Network/Request.php   (参数来源 / 头校验)
#   application/libraries/service/Network/Response.php  (响应信封)
#   application/libraries/service/ErrorCode/ErrorCode.php (错误码 → HTTP 状态)
#
# 覆盖范围：108 个 /api/* 端点（user 24 + admin 19 + group 13 + repository 52）
#           + 4 个 /apiv1/internal/* 端点
#           + 契约错误路径用例（缺参 / 未登录 / 非管理员 / 404 / 缺 Accept / 错 Token）
#
# 字段说明与采集方式见 backend/contract/README.md。

base_url: http://localhost:9080

# ---------------------------------------------------------------------------
# 登录：PHP 侧 /user/login 必须是 application/x-www-form-urlencoded。
# 响应体是 JSON，但响应的 Content-Type 是 text/html; charset=UTF-8（PHP 既有行为）。
# ---------------------------------------------------------------------------
login:
  path: /user/login
  form:
    email: root@codefever.cn
    password: "123456"

# ---------------------------------------------------------------------------
# 采集安全约束（采集器强制执行，违反即中止，不发请求）
#
#  1. forbidden_write_paths 里的路径永远不允许收到 POST/PUT/DELETE。
#     POST /api/admin/config 是 P0 缺陷：data 字段解码为 null 时，
#     array_merge($config, null) 只发 Warning，随后 yaml_emit_file() 会把
#     config.yaml 写成空结构；下一次请求时 www/index.php:21 的
#     make_constants('YAML_', yaml_parse_file(config.yaml)) 拿到 null 抛
#     TypeError → 整个应用（登录 + 全部 API）永久 500。
#     => 单次畸形请求即可砖化全站。本基线不采集该端点的 POST 形态。
#
#  2. 写方法（POST/PUT/DELETE）且未标记 readonly: true 的端点，
#     采集器只允许发送"所有参数均为空值/缺省"的请求，
#     即只能走到"缺参 / 资源不存在"这类不产生任何写操作的失败分支。
#
#  3. readonly: true 仅用于"成功路径也不写库、不改写服务端文件"的 POST 端点。
# ---------------------------------------------------------------------------
safety:
  forbidden_write_paths:
    - /api/admin/config
  require_empty_params_for_write_endpoints: true

# ---------------------------------------------------------------------------
# CI Session 配置。
#   session.key == env.yaml 的 session.key == $config['encryption_key']。
#   CodeIgniter 的会话完全存放在客户端 Cookie 里（sess_use_database = FALSE），
#   用 CI_Encrypt 的 XOR 方案加密，因此采集器可以只用这个 key 就构造出一个
#   "非管理员" 会话 Cookie —— 无需新建用户、无需写库。
# ---------------------------------------------------------------------------
session:
  cookie_name: codefever_community
  key: Ua1xLbQYjAjH5lcansNbKvfN4nJn0rIG
  # 非管理员账号（库中已存在，u_admin=0；u_status=4 已软删除，无法登录，
  # 所以改用会话伪造来覆盖"非管理员访问后台"分支）。
  non_admin_user_key: 26c20714af8bc20aa85be657a5170e71

# ---------------------------------------------------------------------------
# 内部网关鉴权令牌，取自 env.yaml 的 gateway.token
# ---------------------------------------------------------------------------
gateway:
  token: "<codefever_community_api_token>"

# ---------------------------------------------------------------------------
# 演示数据（只读引用）
# ---------------------------------------------------------------------------
demo:
  admin_user_key: "00000000000000000000000000000000"
  admin_email: root@codefever.cn
  group_key: "29efb28ef9dd3018353eb5a02c018b28"   # rootteam（个人组，type=2）
  repository_key: "1031c9342d6539fd36ff79f75ca4f8b7" # demorepo
  branch: master
  commit: f67cfee73d75172d4e7afd77c3efa310b460fa1b
  parent_commit: c943e85a4f996856f19d53e0f59d47e6aa9e29ec
  file: README.md
  repo_path: rootteam/demorepo.git

# ---------------------------------------------------------------------------
# 不存在的资源 key —— 让写端点走"资源不存在 / 参数无效"分支，
# 从而在不污染演示库的前提下覆盖写端点的错误路径。
# ---------------------------------------------------------------------------
invalid:
  repository_key: nonexistent_repository_key_xxx
  group_key: nonexistent_group_key_xxx
  user_key: nonexistent_user_key_xxx
  email: nobody-nonexistent@example.invalid
  commit_sha: 0000000000000000000000000000000000000000
  webhook_key: nonexistent_webhook_key_xxx
  ssh_key_id: nonexistent_ssh_key_id_xxx
  merge_request: nonexistent_merge_request_key_xxx

# ===========================================================================
# 端点用例
#
#   auth:
#     web_user         —— 登录后的普通用户会话（root）
#     admin_web_user   —— 登录后的管理员会话（当前 root 即管理员）
#     non_admin_user   —— 伪造的非管理员会话（见上方 session 段）
#     anonymous        —— 不携带 Cookie
#     internal_gateway —— 内部网关（Token 头）
#
#   params[].from:
#     query —— URL 查询参数
#     body  —— multipart/form-data 表单字段
#     json  —— application/json 请求体字段
#     file  —— multipart/form-data 文件字段（value 相对 manifest 所在目录）
#
#   expect_error   —— 期望的业务错误码（十进制）；null 表示期望成功
#   expect_status  —— 期望的 HTTP 状态码；省略时默认 200
#   expect_content_type —— 期望的响应 Content-Type 前缀；省略时不校验
#   readonly       —— true 表示该 POST 端点的成功路径无副作用，可带参数调用
# ===========================================================================
