<script>
  function pregEmail(email) {
    return /^(\w-*\.*)+@(\w-?)+(\.\w{2,})+$/.test(email)
  }

  function pregTel(tel, isChina) {
    if (isChina) {
      return /^1[3456789]\d{9}$/.test(tel);
    }

    return /^[0-9]{5,11}$/.test(tel)
  }
</script>
<script src="/static/script/additional-methods.js"></script>

<script>
jQuery.validator.addMethod("regex",
    function (value, element, params) {  //  addMethod第2个参数:验证方法，参数（被验证元素的值，被验证元素，参数）
      var exp = new RegExp(params); //  实例化正则对象，参数为传入的正则表达式
      return exp.test(value);         //测试是否匹配
    }
, "格式错误"); // addMethod第3个参数:默认错误信息
jQuery.validator.addMethod("regexTel",
    function (value, element, params) {  //  addMethod第2个参数:验证方法，参数（被验证元素的值，被验证元素，参数）
        var telExp = intltelInput.getCode() == 86 ? /^1[3456789]\d{9}$/ : /^[0-9]{5,11}$/
        var exp = new RegExp(telExp); //  实例化正则对象，参数为传入的正则表达式
        return exp.test(value);         //测试是否匹配
    }
, "格式错误"); // addMethod第3个参数:默认错误信息

var getUrlParameter = function getUrlParameter(sParam) {
    var sPageURL = decodeURIComponent(window.location.search.substring(1)),
        sURLVariables = sPageURL.split('&'),
        sParameterName,
        i;

    for (i = 0; i < sURLVariables.length; i++) {
        sParameterName = sURLVariables[i].split('=');

        if (sParameterName[0] === sParam) {
            return sParameterName[1] === undefined ? true : sParameterName[1];
        }
    }
};

function saveData() {
    var sendForm = $('#registerform').serialize();

    $.ajax({
        type: "POST",
        data: sendForm,
        url: "/user/register",
        dataType: 'json',
        cache: false,
        beforeSend: function( xhr ) {
            $('#submitButton').attr('disabled', 'disabled');
            $('#submitButton').val('注册中...');
        },
        success: function(result, textStatus, jqXHR) {
            code = result.code;
            if (code == 0) {
                $('em.invalid').text('');
                var redirectURL = result.extra.redirect;
                window.location.href = redirectURL;
            } else {
                alertMessage(result.message);
                $('em.invalid').text('');
            }

            $('#submitButton').removeAttr('disabled');
            $('#submitButton').val('注 册');
        },
        error : function(jqXHR, textStatus, errorThrown) {
            $('#submitButton').removeAttr('disabled');
            $('#submitButton').val('注 册');
        }
    });
}

$(document).ready(function() {
    $('em.invalid').text('');
    var password = $("#password");
    var eye = $(".fa-eye");
         eye.click(function(){
         if(password.attr("type") == "password") {
             password.attr("type", 'text');
             eye.removeClass("fa-eye")
                 .addClass("fa-eye-slash");
         } else {
             password.attr("type", "password");
             eye.removeClass("fa-eye-slash")
                .addClass("fa-eye");
         }
    });

    $("input").focus(function() {
         $("em.invalid").text('');
    })

    $("#registerform").validate({
        rules: {
            email: {
                required: true,
                email: true
            },
            password: {
                required: true,
                minlength: 6
            },
            rePassword: {
                required: true,
                equalTo:"#password"
            }
       },
        messages: {
            email : {
                required : "请输入邮箱",
                email:"请输入邮箱",
            },
            password : {
                required: "请输入6-18位登录密码",
                minlength: "密码长度不能小于 6 个字符"
            },
            rePassword: {
                required: "请再次输入密码",
                equalTo: "两次密码不一致"
            }
        },
        submitHandler: function(form) {
            saveData();
        },

        errorPlacement: function(error, element) {
            error.appendTo(element.parents('.form-group'));
        },
        onfocusout: false,
        onkeyup: false,
        onclick: false,
        focusInvalid: false,
        focusCleanup: true
    });
});

function alertMessage(message) {
    toastr.error(message)
}

// 国际区号
var intltelInput = setIntlInput("#tel");
