<script>
  function pregEmail(email) {
    return /^(\w-*\.*)+@(\w-?)+(\.\w{2,})+$/.test(email)
  }

  function pregTel(tel, isChina) {
    if (isChina) {
      return /^1[3456789]\d{9}$/.test(tel);
    }

    return /^[0-9]{5,11}$/.test(tel)
  }
</script>

<script>

jQuery.validator.addMethod("regex",
    function (value, element, params) {  //  addMethod第2个参数:验证方法，参数（被验证元素的值，被验证元素，参数）
      var exp = new RegExp(params); //  实例化正则对象，参数为传入的正则表达式
      return exp.test(value);         //测试是否匹配
    }
, "格式错误"); // addMethod第3个参数:默认错误信息

jQuery.validator.addMethod("regexTel",
    function (value, element, params) {  //  addMethod第2个参数:验证方法，参数（被验证元素的值，被验证元素，参数）
        var telExp = intltelInput.getCode() == 86 ? /^1[3456789]\d{9}$/ : /^[0-9]{5,11}$/
        var exp = new RegExp(telExp); //  实例化正则对象，参数为传入的正则表达式
        return exp.test(value);         //测试是否匹配
    }
, "格式错误"); // addMethod第3个参数:默认错误信息

var key = '';

function verify(data) {
    var verifyForm = $('#verifyform').serialize();
    verifyForm += '&key=' + key;
    $.ajax({
        type : "POST",
        data : verifyForm,
        url : "/user/verify",
        dataType: 'json',
        cache: false,
        headers: {
            'Accept': 'application/json'
        },
        beforeSend: function( xhr ) {
            $('#submitButton').attr('disabled', 'disabled');
        },
        success : function(result, textStatus, jqXHR) {
            $('#submitButton').removeAttr('disabled');
            code = result.code;
            if (code == 0) {
                window.location.href = result.extra.redirect;
            } else {
                alertMessage(result.message);
                if (result.extra.redirect) {
                    setTimeout(function() {
                        window.location.href = result.extra.redirect;
                    }, 2000)
                }
            }
        },
        error : function(jqXHR, textStatus, errorThrown) {
            $('#submitButton').removeAttr('disabled');
        }
    });
}


function alertMessage(message) {
    toastr.error(message)
}

$(document).ready(function(){
    $("#verifyform").validate({
        rules: {
            code: {
                required: true,
                number: true	
            }
        },
        messages: {
            code: {
                required: "请输入验证码",
                number: "请输入验证码"
            }
        },
        submitHandler: function(form) {
            verify();
        },

        errorPlacement: function(error, element) {
            error.appendTo(element.parents('.form-group'));
        },
        onfocusout: false,
        onkeyup: false,
        onclick: false,
        focusInvalid: false,
        focusCleanup: true
    });
});
// 国际区号
var intltelInput = setIntlInput("#tel");
</script>
