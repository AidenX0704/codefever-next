<script>
  function pregEmail(email) {
    return /^(\w-*\.*)+@(\w-?)+(\.\w{2,})+$/.test(email)
  }

  function pregTel(tel, isChina) {
    if (isChina) {
      return /^1[3456789]\d{9}$/.test(tel);
    }

    return /^[0-9]{5,11}$/.test(tel)
  }
</script>

<!-- App scripts -->
<script type="text/javascript">
jQuery.validator.addMethod("regex",
    function (value, element, params) {  //  addMethod第2个参数:验证方法，参数（被验证元素的值，被验证元素，参数）
      var exp = new RegExp(params); //  实例化正则对象，参数为传入的正则表达式
      return exp.test(value);         //测试是否匹配
    }
, "格式错误"); // addMethod第3个参数:默认错误信息
jQuery.validator.addMethod("regexTel",
    function (value, element, params) {  //  addMethod第2个参数:验证方法，参数（被验证元素的值，被验证元素，参数）
        var telExp = intltelInput.getCode() == 86 ? /^1[3456789]\d{9}$/ : /^[0-9]{5,11}$/
        var exp = new RegExp(telExp); //  实例化正则对象，参数为传入的正则表达式
        return exp.test(value);         //测试是否匹配
    }
, "格式错误"); // addMethod第3个参数:默认错误信息

var validateMobileCodeTimes = 0;
var tickingSecond = 120;
var key = ''
var mode = ''

function send() {
    var sendForm = $('#form').serialize();
    sendForm += '&key=' + key;
    sendForm += '&mode=' + mode;

    $.ajax({
        type : "POST",
        data : sendForm,
        url: "/user/resetPassword",
        dataType: 'json',
        cache: false,
        beforeSend: function(xhr) {
            $('#submit').attr('disabled', 'disabled');
            $('input').attr('disabled', 'disabled');
        },
        success : function(result, textStatus, jqXHR) {
            if(result.code) {
                $('#submit').removeAttr('disabled');
                $('input').removeAttr('disabled');
                alertMessage(result.message);
            }
            redirect = result.extra.redirect;
            if (redirect) {
                window.location.href = redirect;
            }
        },
        error : function(jqXHR, textStatus, errorThrown) {
            $('#submit').removeAttr('disabled');
            $('input').removeAttr('disabled');
        }
    });
}

function getResetPasswordCode() {
    var sendForm = $('#form').serialize();    
    var email = $('input[name=email]').val();

    if (!email) {
        alertMessage('')
        return false;
    }
    if (!pregEmail(email)) {
        alertMessage('您输入的邮箱有误，请重新输入')
        return false;
    }

    $.ajax({
        type : "POST",
        data : sendForm,
        url : "/user/getResetPasswordCode",
        dataType: 'json',
        cache: false,
        beforeSend: function(xhr) {
            $('#btn_get_code').text('正在发送').attr('disabled', 'disabled').addClass('color-grey');
        },
        success : function(result, textStatus, jqXHR) {
            if(result.code) {
                alertMessage(result.message);
                $('#btn_get_code').text('获取验证码').removeAttr('disabled').removeClass('color-grey');
            } else {
                //calculate Record
                validateMobileCodeTimes++;
                startTicking();
            }
        },
        error : function(jqXHR, textStatus, errorThrown) {
            $('#btn_get_code').text('获取验证码').removeAttr('disabled').removeClass('color-grey');
        }
    });
}

$(document).ready(function(){
    $("#form").validate({
        rules: {
            email: {
                required: true,
                email: true
            },
            emailCode: {
                required: true
            },
            password: {
                required: true,
                minlength: 6
            },
            re_password: {
                required: true,
                equalTo: "#password"
            }
        },
        messages: {
            email: {
                required: "",
                email: "您输入的邮箱有误，请重新输入"
            },
            emailCode : {
                required: "请输入邮箱验证码",
            },
            password: {
                required: "请输入登录密码",
                minlength: "登录密码不得少于6位，请重新输入"
            },
            re_password: {
                required: "",
                equalTo: "两次密码不一致"
            }
        },
        submitHandler: function(form) {
            send();
        },

        errorPlacement: function(error, element) {
            error.appendTo(element.parents('.form-group'));
        },
        onfocusout: false,
        onkeyup: false,
        onclick: false,
        focusInvalid: false,
        focusCleanup: true
    });
});

function startTicking() {
    if(tickingSecond > 0) {
        $('#btn_get_code').text('已发送 (' + tickingSecond + 's)').attr('disabled', 'disabled').addClass('color-grey');
        setTimeout(startTicking, 1000);
        tickingSecond --;
    } else {
        $('#btn_get_code').text('重新发送').removeAttr('disabled').removeClass('color-grey');
        tickingSecond = 120;
    }
}

function alertMessage(message) {
    toastr.error(message)
}

$(document)
  .on('click', '#btn_get_code', getResetPasswordCode)

// 国际区号
var intltelInput = setIntlInput("#tel");
